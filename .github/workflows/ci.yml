name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  flutter-and-android:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: Dart 静态分析
        run: flutter analyze

      - name: Flutter 测试
        run: flutter test

      - name: Android 单元测试
        working-directory: android
        run: ./gradlew testDebugUnitTest
